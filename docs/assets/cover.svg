  <text x="72" y="292" fill="#e3f0f1" font-size="34" font-weight="500">Identifique o problema.</text>
  <text x="72" y="340" fill="#86d7c2" font-size="34" font-weight="500">Entenda o impacto.</text>
  <text x="72" y="398" fill="#9db8bf" font-size="21">Dependências, evidências e histórico</text>
  <text x="72" y="430" fill="#9db8bf" font-size="21">para equipes que trabalham com dados.</text>
