<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
<title id="title">DataImpact: monitoramento de dados e análise de impacto</title>
<desc id="description">Ilustração vetorial: um alerta de carga parcial ligado ao caminho de uma fonte até dois produtos de dados. Não é uma captura da aplicação.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1d2c"/><stop offset="1" stop-color="#123740"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#208d7b" stop-opacity=".2"/><stop offset="1" stop-color="#208d7b" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6ea5a9" opacity=".13"/></pattern>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#55baaa" stroke-width="1.3"/></marker>
 <clipPath id="clip"><rect width="1600" height="640" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1600" height="640" fill="url(#background)"/><rect width="1600" height="640" fill="url(#dots)"/><ellipse cx="1250" cy="290" rx="590" ry="450" fill="url(#light)"/>
